[build-system]
requires = ["setuptools>=82", "wheel>=0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "dp_tools"
version = "1.3.12"
description = "Tooling for Data Processing Operations"
authors = [
    {name = "Jonathan Oribello", email = "jonathan.d.oribello@gmail.com"},
    {name = "Alexis Torres", email = "lextorres46@gmail.com"},
    ]
maintainers = [
    {name = "Alexis Torres", email = "lextorres46@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "pandas>=3.0.3",
    "schema>=0.7.8",
    "tabulate>=0.10.0",
    # "multiqc==1.26",  # optional: validation / metrics extraction (pip install multiqc==1.26)
    "pandera>=0.32.1",
    "click>=8.4.2",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-console_scripts>=1.4.1",
]

[project.scripts]
dp_tools = "dp_tools.scripts.top_level_cli:main"
dpt = "dp_tools.scripts.top_level_cli:main"
dpt-get-isa-archive = "dp_tools.scripts.isa_cli:get_isa_archive_cli"
dpt-isa-to-runsheet = "dp_tools.scripts.isa_cli:isa_to_runsheet_cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"dp_tools" = ["config/*.yaml", "assets/*"] 